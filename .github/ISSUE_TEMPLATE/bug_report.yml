name: Bug report
description: A script fails, or a report is not what the docs describe
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        The six flaws in `app/app.py` are intentional, so please do not report them.
        For a real security issue, use private vulnerability reporting (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got instead.
      placeholder: .\scripts\Invoke-FormatShowcase.ps1 -Tool zap ...
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: The relevant lines of `scan.log` or of the console output.
      render: text
  - type: input
    id: os
    attributes:
      label: OS and PowerShell version
      placeholder: Windows 11, PowerShell 7.6
    validations:
      required: true
  - type: input
    id: docker
    attributes:
      label: Docker version
      placeholder: Docker Desktop 29.0
    validations:
      required: true
